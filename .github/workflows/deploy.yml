name: Deploy frontend to GitHub Pages

# 只部署前端（静态站点）。后端是独立的 FastAPI 服务，需另行部署到
# 支持长驻进程的平台（Hugging Face Spaces / Render 等），
# 并通过仓库变量 VITE_API_BASE 把地址注入到构建里。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Warn if VITE_API_BASE is missing
        run: |
          if [ -z "${{ vars.VITE_API_BASE }}" ]; then
            echo "::warning title=未配置后端地址::仓库变量 VITE_API_BASE 为空，构建出的前端将连不上后端（页面会提示后端未连通）。请在 Settings → Secrets and variables → Actions → Variables 里添加 VITE_API_BASE。"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # 子路径部署：https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # 后端绝对地址（跨域必须绝对 URL）
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: SPA fallback (深链接回退)
        # GitHub Pages 对未知路径返回 404.html，前端路由据此接管
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
