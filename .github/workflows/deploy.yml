name: Deploy frontend to GitHub Pages

# 两种模式自动切换：
#   ① 仓库变量 VITE_API_BASE 已配置 → 正常构建，请求真实后端
#   ② 没配置                        → 走「纯静态演示」模式：
#      前端读 public/demo-data/*.json（由 scripts/export_static_demo.py 预导出），
#      不需要任何后端也能看完整界面。这样即使后端还没部署，Pages 也是可用的。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Decide build mode
        id: mode
        run: |
          if [ -n "${{ vars.VITE_API_BASE }}" ]; then
            echo "static_demo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=构建模式::连接真实后端 ${{ vars.VITE_API_BASE }}"
          else
            echo "static_demo=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=构建模式::未配置 VITE_API_BASE，回退到「纯静态演示」模式（读 demo-data/*.json，无后端）"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # 子路径部署：https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # 后端绝对地址（跨域必须绝对 URL）；为空则走静态演示
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_STATIC_DEMO: ${{ steps.mode.outputs.static_demo }}
        run: npm run build

      - name: SPA fallback (深链接回退)
        # GitHub Pages 对未知路径返回 404.html，前端路由据此接管
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
